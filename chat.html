<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Server Souls — Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #080810;
      --surface: #10101c;
      --surface2: #161624;
      --surface3: #1c1c2e;
      --border: rgba(255,255,255,.07);

      --text: #ede9e4;
      --muted: #7a7890;

      --accent: #c2607a;
      --accent-light: #e8859a;

      --success: #4caf7d;
      --danger: #df6b75;

      --font-display: "Cormorant Garamond", serif;
      --font-body: "DM Sans", sans-serif;

      --header-height: 64px;
      --composer-height: 76px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    /* ================= HEADER ================= */

    .chat-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;

      height: var(--header-height);

      display: flex;
      align-items: center;
      gap: 12px;

      padding: 0 16px;

      background: rgba(8,8,16,.94);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: var(--muted);
      background: var(--surface2);

      border: 1px solid var(--border);

      text-decoration: none;

      flex-shrink: 0;
    }

    .back-btn:hover {
      color: var(--text);
    }

    .chat-avatar {
      width: 40px;
      height: 40px;

      border-radius: 50%;
      overflow: hidden;

      background: var(--surface2);

      border: 1px solid var(--border);

      flex-shrink: 0;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

      font-family: var(--font-display);
      font-size: 18px;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-name {
      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-status {
      margin-top: 2px;

      color: var(--muted);
      font-size: 11px;
    }

    .chat-status.online {
      color: var(--success);
    }

    .chat-status.offline {
      color: var(--danger);
    }

    .view-profile-btn {
      padding: 7px 13px;

      border-radius: 8px;

      background: transparent;
      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 12px;
      text-decoration: none;

      white-space: nowrap;
    }

    .view-profile-btn:hover {
      color: var(--text);
    }

    /* ================= MESSAGES ================= */

    .messages-area {
      position: fixed;

      top: var(--header-height);
      bottom: var(--composer-height);

      left: 0;
      right: 0;

      overflow-y: auto;
      overflow-x: hidden;

      padding: 18px;

      scroll-behavior: smooth;

      scrollbar-width: thin;
      scrollbar-color: var(--surface3) transparent;
    }

    .messages-area::-webkit-scrollbar {
      width: 5px;
    }

    .messages-area::-webkit-scrollbar-thumb {
      background: var(--surface3);
      border-radius: 10px;
    }

    .date-divider {
      width: fit-content;

      margin: 12px auto 14px;

      padding: 5px 10px;

      border-radius: 20px;

      background: rgba(255,255,255,.035);

      color: var(--muted);

      font-size: 10px;
    }

    .msg-row {
      width: 100%;

      display: flex;
      align-items: flex-end;

      gap: 7px;

      margin-bottom: 5px;

      animation: messageIn .18s ease-out;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-row.me {
      justify-content: flex-end;
    }

    .msg-row.them {
      justify-content: flex-start;
    }

    .msg-avatar {
      width: 27px;
      height: 27px;

      border-radius: 50%;

      overflow: hidden;

      background: var(--surface2);

      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      max-width: min(72%, 520px);
      min-width: 0;
    }

    .bubble {
      display: inline-block;

      max-width: 100%;

      padding: 10px 13px;

      border-radius: 18px;

      font-size: 14px;
      line-height: 1.5;

      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .msg-row.them .bubble {
      background: var(--surface2);

      border: 1px solid var(--border);

      border-bottom-left-radius: 5px;
    }

    .msg-row.me .bubble {
      background: var(--accent);

      color: white;

      border-bottom-right-radius: 5px;
    }

    .bubble-time {
      margin-top: 3px;
      padding: 0 3px;

      color: var(--muted);
      font-size: 9px;
    }

    .msg-row.me .bubble-time {
      text-align: right;
    }

    /* ================= EMPTY STATE ================= */

    .match-card {
      width: min(100%, 430px);

      margin: 12px auto 18px;

      padding: 22px;

      background: var(--surface);

      border: 1px solid var(--border);

      border-radius: 18px;

      text-align: center;
    }

    .match-card-avatar {
      width: 76px;
      height: 76px;

      margin: 0 auto 12px;

      border-radius: 50%;

      overflow: hidden;

      background: var(--surface2);

      border: 2px solid var(--accent);
    }

    .match-card-avatar img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .match-card-name {
      font-family: var(--font-display);

      font-size: 23px;
      font-style: italic;

      margin-bottom: 4px;
    }

    .match-card-sub {
      color: var(--muted);
      font-size: 12px;
    }

    .match-card-tags {
      display: flex;
      flex-wrap: wrap;

      justify-content: center;

      gap: 6px;

      margin-top: 12px;
    }

    .match-tag {
      padding: 4px 10px;

      border-radius: 20px;

      background: var(--surface2);

      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 10px;
    }

    .empty-chat {
      text-align: center;

      padding: 25px 20px 40px;
    }

    .empty-chat p {
      margin-bottom: 5px;

      color: var(--muted);

      font-family: var(--font-display);

      font-size: 19px;
      font-style: italic;
    }

    .empty-chat small {
      color: var(--muted);
      opacity: .6;

      font-size: 11px;
    }

    /* ================= LOADING ================= */

    .loading-container {
      position: absolute;

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-ring {
      width: 28px;
      height: 28px;

      border: 2px solid var(--border);
      border-top-color: var(--accent);

      border-radius: 50%;

      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= ERROR ================= */

    .error-state {
      width: min(100%, 420px);

      margin: auto;

      text-align: center;

      padding: 30px;
    }

    .error-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .error-title {
      font-family: var(--font-display);

      font-size: 21px;
      font-style: italic;

      margin-bottom: 6px;
    }

    .error-text {
      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;

      margin-bottom: 16px;
    }

    .retry-btn {
      padding: 9px 16px;

      border-radius: 10px;

      background: var(--surface2);

      border: 1px solid var(--border);

      color: var(--text);

      cursor: pointer;

      font-size: 12px;
    }

    /* ================= COMPOSER ================= */

    .input-bar {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      min-height: var(--composer-height);

      display: flex;
      align-items: flex-end;

      gap: 9px;

      padding:
        10px
        16px
        calc(10px + env(safe-area-inset-bottom));

      background: rgba(8,8,16,.95);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-top: 1px solid var(--border);
    }

    .msg-input {
      flex: 1;

      width: 100%;

      min-height: 44px;
      max-height: 120px;

      padding: 11px 16px;

      background: var(--surface2);

      border: 1px solid var(--border);

      border-radius: 22px;

      color: var(--text);

      outline: none;

      resize: none;

      overflow-y: auto;

      font-size: 14px;
      line-height: 1.5;
    }

    .msg-input:focus {
      border-color: rgba(194,96,122,.45);
    }

    .msg-input::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border: none;
      border-radius: 50%;

      background: var(--accent);

      color: white;

      cursor: pointer;
    }

    .send-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .send-btn:not(:disabled):active {
      transform: scale(.92);
    }

    .send-spinner {
      width: 16px;
      height: 16px;

      border: 2px solid rgba(255,255,255,.35);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .65s linear infinite;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;

      left: 50%;
      bottom: calc(var(--composer-height) + 15px);

      transform: translate(-50%, 15px);

      z-index: 1000;

      max-width: calc(100% - 30px);

      padding: 9px 14px;

      border-radius: 10px;

      background: #221419;

      border: 1px solid rgba(223,107,117,.28);

      color: #ffd9dc;

      font-size: 12px;

      opacity: 0;

      pointer-events: none;

      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      :root {
        --header-height: 60px;
        --composer-height: 70px;
      }

      .chat-header {
        padding-left: 10px;
        padding-right: 10px;
        gap: 9px;
      }

      .chat-avatar {
        width: 38px;
        height: 38px;
      }

      .view-profile-btn {
        display: none;
      }

      .messages-area {
        padding: 14px 10px 20px;
      }

      .message-content {
        max-width: 82%;
      }

      .input-bar {
        padding-left: 9px;
        padding-right: 9px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="chat-header">

    <a
      href="/matches"
      class="back-btn"
      aria-label="Back"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </a>

    <div class="chat-avatar">

      <img
        id="headerAvatar"
        src=""
        alt=""
        style="display:none;"
      >

      <div
        id="headerAvatarPlaceholder"
        class="avatar-placeholder"
      >
        •
      </div>

    </div>

    <div class="chat-info">

      <div
        id="headerName"
        class="chat-name"
      >
        Loading...
      </div>

      <div
        id="headerStatus"
        class="chat-status"
      >
        Connecting...
      </div>

    </div>

    <a
      id="viewProfileBtn"
      href="#"
      class="view-profile-btn"
    >
      View profile
    </a>

  </header>


  <!-- MESSAGES -->

  <main
    id="messagesArea"
    class="messages-area"
    aria-live="polite"
  >

    <div class="loading-container">
      <div class="loading-ring"></div>
    </div>

  </main>


  <!-- COMPOSER -->

  <div class="input-bar">

    <textarea
      id="msgInput"
      class="msg-input"
      rows="1"
      maxlength="1000"
      placeholder="Message..."
      autocomplete="off"
      spellcheck="true"
    ></textarea>

    <button
      id="sendBtn"
      class="send-btn"
      type="button"
      disabled
      aria-label="Send message"
    >

      <svg
        id="sendIcon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line
          x1="22"
          y1="2"
          x2="11"
          y2="13"
        ></line>

        <polygon
          points="22 2 15 22 11 13 2 9 22 2"
        ></polygon>

      </svg>

    </button>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


  <!-- YOUR EXISTING APP.JS -->

  <script src="/app.js"></script>


  <script>

    "use strict";


    /* =========================================================
       STATE
    ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const matchId =
      params.get("id");


    let myUserId = null;

    let otherProfile = null;

    let messages =
      new Map();

    let realtimeChannel = null;

    let realtimeRetryTimer = null;

    let isSending = false;

    let toastTimer = null;


    /* =========================================================
       DOM
    ========================================================= */

    const messagesArea =
      document.getElementById(
        "messagesArea"
      );

    const msgInput =
      document.getElementById(
        "msgInput"
      );

    const sendBtn =
      document.getElementById(
        "sendBtn"
      );

    const sendIcon =
      document.getElementById(
        "sendIcon"
      );

    const headerAvatar =
      document.getElementById(
        "headerAvatar"
      );

    const headerAvatarPlaceholder =
      document.getElementById(
        "headerAvatarPlaceholder"
      );

    const headerName =
      document.getElementById(
        "headerName"
      );

    const headerStatus =
      document.getElementById(
        "headerStatus"
      );

    const viewProfileBtn =
      document.getElementById(
        "viewProfileBtn"
      );


    /* =========================================================
       INIT
    ========================================================= */

    document.addEventListener(
      "DOMContentLoaded",
      init
    );


    async function init() {

      if (!matchId) {

        window.location.href =
          "/matches";

        return;
      }


      try {

        /*
         * Your existing app.js provides requireAuth()
         */

        const token =
          await requireAuth();


        if (!token) return;


        /*
         * Get current Supabase user.
         */

        const {
          data,
          error
        } =
          await _sb.auth.getUser();


        if (
          error ||
          !data ||
          !data.user
        ) {

          window.location.href =
            "/";

          return;
        }


        myUserId =
          data.user.id;


        setupInput();

        setupAuthListener();


        await loadMatchInfo();

        await loadMessages();

        /*
         * IMPORTANT:
         * Subscribe AFTER loading history.
         */

        await subscribeRealtime();


      } catch (error) {

        console.error(
          "Chat initialization failed:",
          error
        );


        showFatalError(
          error.message ||
          "Unable to load chat."
        );
      }
    }


    /* =========================================================
       AUTH
    ========================================================= */

    function setupAuthListener() {

      _sb.auth.onAuthStateChange(
        (
          event,
          session
        ) => {

          if (
            event === "SIGNED_OUT" ||
            !session
          ) {

            cleanupRealtime();

            window.location.href =
              "/";

            return;
          }


          if (
            session.user
          ) {

            myUserId =
              session.user.id;
          }

        }
      );
    }


    /* =========================================================
       MATCH INFO
    ========================================================= */

    async function loadMatchInfo() {

      const matches =
        await api(
          "/api/matches"
        );


      if (
        !Array.isArray(matches)
      ) {

        throw new Error(
          "Invalid matches response."
        );
      }


      const match =
        matches.find(
          item =>
            String(
              item.match_id
            ) ===
            String(matchId)
        );


      if (!match) {

        throw new Error(
          "This match could not be found."
        );
      }


      if (!match.profile) {

        throw new Error(
          "Matched profile could not be loaded."
        );
      }


      otherProfile =
        match.profile;


      renderHeader();
    }


    function renderHeader() {

      const firstName =
        otherProfile.first_name ||
        "Unknown";


      const age =
        otherProfile.age != null
          ? ", " +
            otherProfile.age
          : "";


      headerName.textContent =
        firstName + age;


      headerStatus.textContent =
        otherProfile.hostel ||
        "IISERB";


      if (
        otherProfile.id
      ) {

        viewProfileBtn.href =
          "/profile?uid=" +
          encodeURIComponent(
            otherProfile.id
          );

      } else {

        viewProfileBtn.style.display =
          "none";
      }


      if (
        otherProfile.photo
      ) {

        headerAvatar.src =
          otherProfile.photo;

        headerAvatar.alt =
          firstName;

        headerAvatar.style.display =
          "block";

        headerAvatarPlaceholder.style.display =
          "none";

      } else {

        headerAvatar.style.display =
          "none";

        headerAvatarPlaceholder.style.display =
          "flex";

        headerAvatarPlaceholder.textContent =
          getInitials(
            firstName
          );
      }
    }


    /* =========================================================
       LOAD MESSAGES
    ========================================================= */

    async function loadMessages() {

      showLoading();


      try {

        const data =
          await api(
            "/api/messages/" +
            encodeURIComponent(
              matchId
            )
          );


        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "Invalid messages response."
          );
        }


        messages.clear();


        for (
          const message of data
        ) {

          if (
            message &&
            message.id
          ) {

            messages.set(
              String(
                message.id
              ),
              message
            );
          }
        }


        renderMessages(
          true
        );

      } finally {

        hideLoading();
      }
    }


    /* =========================================================
       REALTIME
       
       THERE IS ONLY ONE subscribeRealtime()
       ========================================================= */

    async function subscribeRealtime() {

      console.log(
        "Starting realtime for match:",
        matchId
      );


      cleanupRealtime();


      try {

        realtimeChannel =
          _sb.channel(
            "server-souls-chat-" +
            matchId +
            "-" +
            myUserId
          );


        realtimeChannel.on(
          "postgres_changes",

          {
            event: "INSERT",

            schema: "public",

            table: "messages"
          },

          function(payload) {

            console.log(
              "🔥 REALTIME EVENT:",
              payload
            );


            const message =
              payload.new;


            if (!message) {
              return;
            }


            /*
             * Only process messages
             * belonging to this chat.
             */

            if (
              String(
                message.match_id
              ) !==
              String(matchId)
            ) {

              return;
            }


            if (!message.id) {
              return;
            }


            const id =
              String(
                message.id
              );


            /*
             * Prevent duplicate messages.
             */

            if (
              messages.has(id)
            ) {

              return;
            }


            messages.set(
              id,
              message
            );


            renderMessages(
              true
            );


            console.log(
              "✅ MESSAGE RECEIVED LIVE"
            );

          }
        );


        realtimeChannel.subscribe(
          function(status) {

            console.log(
              "📡 REALTIME STATUS:",
              status
            );


            if (
              status ===
              "SUBSCRIBED"
            ) {

              console.log(
                "✅ REALTIME CONNECTED"
              );


              updateConnectionStatus(
                "online"
              );


              clearTimeout(
                realtimeRetryTimer
              );


              return;
            }


            if (
              status ===
              "CHANNEL_ERROR"
            ) {

              console.error(
                "❌ REALTIME CHANNEL ERROR"
              );


              updateConnectionStatus(
                "offline"
              );


              scheduleRealtimeRetry();


              return;
            }


            if (
              status ===
              "TIMED_OUT"
            ) {

              console.error(
                "❌ REALTIME TIMED OUT"
              );


              updateConnectionStatus(
                "offline"
              );


              scheduleRealtimeRetry();


              return;
            }


            if (
              status ===
              "CLOSED"
            ) {

              console.warn(
                "⚠️ REALTIME CLOSED"
              );


              updateConnectionStatus(
                "offline"
              );


              scheduleRealtimeRetry();
            }

          }
        );

      } catch (error) {

        console.error(
          "❌ REALTIME SETUP FAILED:",
          error
        );


        updateConnectionStatus(
          "offline"
        );


        scheduleRealtimeRetry();
      }
    }


    /* =========================================================
       REALTIME RETRY
    ========================================================= */

    function scheduleRealtimeRetry() {

      clearTimeout(
        realtimeRetryTimer
      );


      realtimeRetryTimer =
        setTimeout(
          function() {

            if (
              document.visibilityState ===
              "visible"
            ) {

              subscribeRealtime();
            }

          },
          3000
        );
    }


    function cleanupRealtime() {

      clearTimeout(
        realtimeRetryTimer
      );


      realtimeRetryTimer =
        null;


      if (
        realtimeChannel
      ) {

        try {

          _sb.removeChannel(
            realtimeChannel
          );

        } catch (error) {

          console.warn(
            "Realtime cleanup:",
            error
          );
        }


        realtimeChannel =
          null;
      }
    }


    /* =========================================================
       RENDER MESSAGES
    ========================================================= */

    function renderMessages(
      forceScroll
    ) {

      const sorted =
        Array.from(
          messages.values()
        ).sort(
          function(a, b) {

            return (
              new Date(
                a.created_at
              ) -
              new Date(
                b.created_at
              )
            );
          }
        );


      if (
        sorted.length === 0
      ) {

        renderEmptyConversation();

        return;
      }


      const shouldScroll =
        forceScroll ||
        isNearBottom();


      let html = "";

      let lastDate = "";


      for (
        const message of sorted
      ) {

        const date =
          new Date(
            message.created_at
          );


        const dateKey =
          getDateKey(date);


        if (
          dateKey !==
          lastDate
        ) {

          html +=
            renderDateDivider(
              date
            );


          lastDate =
            dateKey;
        }


        html +=
          renderMessage(
            message
          );
      }


      messagesArea.innerHTML =
        html;


      if (
        shouldScroll
      ) {

        scrollToBottom();
      }
    }


    function renderMessage(
      message
    ) {

      const isMe =
        String(
          message.sender_id
        ) ===
        String(myUserId);


      const date =
        new Date(
          message.created_at
        );


      const time =
        date.toLocaleTimeString(
          "en-IN",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      let avatarHTML =
        "";


      if (!isMe) {

        if (
          otherProfile &&
          otherProfile.photo
        ) {

          avatarHTML = `
            <div class="msg-avatar">
              <img
                src="${escapeAttribute(
                  otherProfile.photo
                )}"
                alt=""
              >
            </div>
          `;

        } else {

          avatarHTML = `
            <div class="msg-avatar">
              <div class="avatar-placeholder">
                ${escapeHtml(
                  getInitials(
                    otherProfile?.first_name
                  )
                )}
              </div>
            </div>
          `;
        }
      }


      return `
        <div
          class="msg-row ${
            isMe
              ? "me"
              : "them"
          }"
          data-message-id="${escapeAttribute(
            message.id
          )}"
        >

          ${avatarHTML}

          <div class="message-content">

            <div class="bubble">
              ${escapeHtml(
                message.content || ""
              )}
            </div>

            <div class="bubble-time">
              ${escapeHtml(
                time
              )}
            </div>

          </div>

        </div>
      `;
    }


    function renderDateDivider(
      date
    ) {

      return `
        <div class="date-divider">
          ${escapeHtml(
            formatDateDivider(
              date
            )
          )}
        </div>
      `;
    }


    /* =========================================================
       EMPTY CONVERSATION
    ========================================================= */

    function renderEmptyConversation() {

      const name =
        otherProfile?.first_name ||
        "your match";


      const photo =
        otherProfile?.photo;


      let avatarHTML;


      if (photo) {

        avatarHTML = `
          <img
            src="${escapeAttribute(
              photo
            )}"
            alt=""
          >
        `;

      } else {

        avatarHTML = `
          <div
            class="avatar-placeholder"
          >
            ${escapeHtml(
              getInitials(
                name
              )
            )}
          </div>
        `;
      }


      const tags = [
        otherProfile?.year,
        otherProfile?.major,
        otherProfile?.hostel
      ].filter(Boolean);


      let tagsHTML = "";


      if (
        tags.length
      ) {

        tagsHTML = `
          <div class="match-card-tags">

            ${tags
              .map(
                function(tag) {

                  return `
                    <span class="match-tag">
                      ${escapeHtml(
                        String(tag)
                      )}
                    </span>
                  `;
                }
              )
              .join("")}

          </div>
        `;
      }


      messagesArea.innerHTML = `
        <div class="match-card">

          <div class="match-card-avatar">
            ${avatarHTML}
          </div>

          <div class="match-card-name">
            ${escapeHtml(
              name
            )}
            ${
              otherProfile?.age != null
                ? ", " +
                  escapeHtml(
                    String(
                      otherProfile.age
                    )
                  )
                : ""
            }
          </div>

          <div class="match-card-sub">
            You matched! Say hello 👋
          </div>

          ${tagsHTML}

        </div>

        <div class="empty-chat">

          <p>
            start the conversation
          </p>

          <small>
            be the first to say something
          </small>

        </div>
      `;
    }


    /* =========================================================
       SEND MESSAGE
    ========================================================= */

    async function sendMessage() {

      if (
        isSending
      ) {

        return;
      }


      const content =
        msgInput.value.trim();


      if (!content) {

        return;
      }


      isSending =
        true;


      const original =
        content;


      msgInput.value =
        "";


      resetInput();

      updateSendButton();

      setSendingState(
        true
      );


      try {

        const created =
          await api(
            "/api/messages/" +
            encodeURIComponent(
              matchId
            ),
            {
              method: "POST",

              body: {
                content:
                  original
              }
            }
          );


        /*
         * Display immediately from
         * POST response.
         *
         * Realtime may also deliver it,
         * but Map prevents duplicates.
         */

        if (
          created &&
          created.id
        ) {

          const id =
            String(
              created.id
            );


          if (
            !messages.has(id)
          ) {

            messages.set(
              id,
              created
            );


            renderMessages(
              true
            );
          }
        }

      } catch (error) {

        console.error(
          "Send failed:",
          error
        );


        msgInput.value =
          original;


        autoResize(
          msgInput
        );


        showToast(
          error.message ||
          "Message could not be sent."
        );

      } finally {

        isSending =
          false;


        setSendingState(
          false
        );


        updateSendButton();


        msgInput.focus();
      }
    }


    /* =========================================================
       INPUT
    ========================================================= */

    function setupInput() {

      msgInput.addEventListener(
        "input",
        function() {

          autoResize(
            msgInput
          );

          updateSendButton();
        }
      );


      msgInput.addEventListener(
        "keydown",
        function(event) {

          if (
            event.key ===
            "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            sendMessage();
          }
        }
      );


      sendBtn.addEventListener(
        "click",
        sendMessage
      );


      updateSendButton();
    }


    function autoResize(
      element
    ) {

      element.style.height =
        "44px";


      element.style.height =
        Math.min(
          element.scrollHeight,
          120
        ) + "px";
    }


    function resetInput() {

      msgInput.style.height =
        "44px";
    }


    function updateSendButton() {

      sendBtn.disabled =
        isSending ||
        !msgInput.value.trim();
    }


    function setSendingState(
      sending
    ) {

      if (
        sending
      ) {

        sendIcon.style.display =
          "none";


        if (
          !sendBtn.querySelector(
            ".send-spinner"
          )
        ) {

          const spinner =
            document.createElement(
              "span"
            );


          spinner.className =
            "send-spinner";


          sendBtn.appendChild(
            spinner
          );
        }

      } else {

        sendIcon.style.display =
          "block";


        const spinner =
          sendBtn.querySelector(
            ".send-spinner"
          );


        if (
          spinner
        ) {

          spinner.remove();
        }
      }
    }


    /* =========================================================
       LOADING
    ========================================================= */

    function showLoading() {

      messagesArea.innerHTML = `
        <div class="loading-container">
          <div class="loading-ring"></div>
        </div>
      `;
    }


    function hideLoading() {

      const loader =
        messagesArea.querySelector(
          ".loading-container"
        );


      if (
        loader
      ) {

        loader.remove();
      }
    }


    /* =========================================================
       ERROR
    ========================================================= */

    function showFatalError(
      message
    ) {

      messagesArea.innerHTML = `
        <div class="error-state">

          <div class="error-icon">
            ♡
          </div>

          <div class="error-title">
            Something went wrong
          </div>

          <div class="error-text">
            ${escapeHtml(
              message
            )}
          </div>

          <button
            class="retry-btn"
            onclick="location.reload()"
          >
            Try again
          </button>

        </div>
      `;
    }


    /* =========================================================
       CONNECTION
    ========================================================= */

    function updateConnectionStatus(
      state
    ) {

      headerStatus.classList.remove(
        "online",
        "offline"
      );


      if (
        state ===
        "online"
      ) {

        headerStatus.classList.add(
          "online"
        );


        headerStatus.textContent =
          otherProfile?.hostel ||
          "IISERB";


      } else {

        headerStatus.classList.add(
          "offline"
        );


        headerStatus.textContent =
          "Reconnecting...";
      }
    }


    /* =========================================================
       SCROLL
    ========================================================= */

    function isNearBottom() {

      const distance =
        messagesArea.scrollHeight -
        messagesArea.scrollTop -
        messagesArea.clientHeight;


      return distance <
        120;
    }


    function scrollToBottom() {

      requestAnimationFrame(
        function() {

          messagesArea.scrollTop =
            messagesArea.scrollHeight;
        }
      );
    }


    /* =========================================================
       DATE
    ========================================================= */

    function getDateKey(
      date
    ) {

      return [
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ].join("-");
    }


    function formatDateDivider(
      date
    ) {

      const today =
        new Date();


      const yesterday =
        new Date();


      yesterday.setDate(
        yesterday.getDate() -
        1
      );


      if (
        getDateKey(date) ===
        getDateKey(today)
      ) {

        return "Today";
      }


      if (
        getDateKey(date) ===
        getDateKey(yesterday)
      ) {

        return "Yesterday";
      }


      return date.toLocaleDateString(
        "en-IN",
        {
          weekday: "long",
          month: "short",
          day: "numeric"
        }
      );
    }


    /* =========================================================
       TOAST
    ========================================================= */

    function showToast(
      message
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          function() {

            toast.classList.remove(
              "show"
            );

          },
          3000
        );
    }


    /* =========================================================
       SECURITY
    ========================================================= */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        )
        .replace(
          /\n/g,
          "<br>"
        );
    }


    function escapeAttribute(
      value
    ) {

      return String(
        value ?? ""
      )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        );
    }


    function getInitials(
      name
    ) {

      if (
        !name
      ) {

        return "?";
      }


      return String(
        name
      )
        .trim()
        .charAt(0)
        .toUpperCase();
    }


    /* =========================================================
       VISIBILITY / RECONNECT
    ========================================================= */

    document.addEventListener(
      "visibilitychange",
      async function() {

        if (
          document.visibilityState ===
          "visible"
        ) {

          try {

            const {
              data
            } =
              await _sb.auth.getSession();


            if (
              data &&
              data.session
            ) {

              myUserId =
                data.session.user.id;


              await subscribeRealtime();
            }

          } catch (error) {

            console.warn(
              "Reconnect failed:",
              error
            );
          }
        }
      }
    );


    /* =========================================================
       CLEANUP
    ========================================================= */

    window.addEventListener(
      "beforeunload",
      function() {

        cleanupRealtime();
      }
    );

  </script>

</body>
